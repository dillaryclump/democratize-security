schema_version = "1.4"
artifacts = [{ source = "/candidate/app.py", destination = "app.py", service = "collector" }]

[task]
name = "democratize-security/invoice-export"
version = "0.1.0"

[agent]
timeout_sec = 900

[environment]
cpus = 1
memory_mb = 512
storage_mb = 1024
network_mode = "no-network"

[verifier]
timeout_sec = 300
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 1024
storage_mb = 2048
network_mode = "no-network"

# Runs in the collector after Harbor has stopped the agent's container.
[[verifier.collect]]
service = "collector"
command = "python3 -I /opt/collect.py /agent-candidate/app.py /candidate/app.py 65536"
timeout_sec = 30
