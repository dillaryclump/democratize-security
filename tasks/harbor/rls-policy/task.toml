schema_version = "1.4"
artifacts = [{ source = "/candidate/policy.json", destination = "policy.json" }]

[task]
name = "democratize-security/rls-policy"
version = "0.1.0"

[agent]
timeout_sec = 30

[environment]
cpus = 1
memory_mb = 256
storage_mb = 512
network_mode = "no-network"

[verifier]
timeout_sec = 90
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 512
storage_mb = 1024
network_mode = "no-network"
