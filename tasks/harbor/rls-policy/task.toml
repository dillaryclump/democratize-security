schema_version = "1.4"
# Harbor otherwise re-uploads the agent-written /logs/artifacts bind mount into
# the verifier unchecked; this explicit entry excludes everything and lands in a
# fresh host directory, so the verifier receives at most an empty directory.
artifacts = [
  { source = "/logs/artifacts", destination = "agent-artifacts", exclude = ["*"] },
  { source = "/candidate/policy.json", destination = "policy.json", service = "collector" },
]

[task]
name = "democratize-security/rls-policy"
version = "0.1.0"

[agent]
timeout_sec = 30

[environment]
cpus = 1
memory_mb = 256
storage_mb = 512
network_mode = "no-network"

[verifier]
timeout_sec = 90
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 512
storage_mb = 1024
network_mode = "no-network"

# Runs in the collector after Harbor has stopped the agent's container.
[[verifier.collect]]
service = "collector"
command = "python3 -I /opt/collect.py /agent-candidate/policy.json /candidate/policy.json 4096"
timeout_sec = 30
