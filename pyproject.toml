[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "democratize-security"
version = "0.1.0.dev0"
description = "Security integration and reproducible evaluation for AI-assisted development"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
research = "democratize_security.cli:main"

[project.optional-dependencies]
reference = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]
harbor = [
    "harbor==0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/democratize_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable real PostgreSQL server", "worker: requires local Linux Docker and a trusted image"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Starters are the reference app minus one endpoint; its imports are hints.
"tasks/harbor/invoice-*/environment/app.py" = ["F401"]
