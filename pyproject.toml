[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "democratize-security"
version = "0.1.0.dev0"
description = "Security integration and reproducible evaluation for AI-assisted development"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
research = "democratize_security.cli:main"

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/democratize_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
