[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "democratize-security"
version = "0.1.0.dev0"
description = "Research harness that measures whether AI coding agents produce code that is both functional and secure, starting with tenant isolation on FastAPI and PostgreSQL row-level security"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Democratize Security Authors" }]
keywords = [
    "ai-security",
    "coding-agents",
    "llm-evaluation",
    "secure-code-generation",
    "tenant-isolation",
    "multi-tenancy",
    "row-level-security",
    "postgresql",
    "fastapi",
    "access-control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/dillaryclump/democratize-security"
Documentation = "https://github.com/dillaryclump/democratize-security/tree/main/docs"
Issues = "https://github.com/dillaryclump/democratize-security/issues"
Changelog = "https://github.com/dillaryclump/democratize-security/blob/main/CHANGELOG.md"

[project.scripts]
research = "democratize_security.cli:main"

[project.optional-dependencies]
reference = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]
harbor = [
    "harbor==0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/democratize_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable real PostgreSQL server", "worker: requires local Linux Docker and a trusted image"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Starters are the reference app minus one endpoint; its imports are hints.
"tasks/harbor/invoice-*/environment/app.py" = ["F401"]
"tasks/pilot/*/environment/app.py" = ["F401"]
