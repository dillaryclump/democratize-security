# /etc/wsl.conf for a dedicated WSL2 worker distro (issue #54).
# No Windows drives, no Windows executables, no Windows PATH entries.
[boot]
systemd=true

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[user]
default=controller

[network]
hostname=ds-worker
