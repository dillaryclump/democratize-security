name: CI
on:
  push:
    branches: [main, foundation/project-setup, milestone/reference-verifier]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} ruff check .
      - run: uv run --locked --python ${{ matrix.python }} ruff format --check .
      - run: uv run --locked --python ${{ matrix.python }} pytest
      - run: uv run --locked --python ${{ matrix.python }} research validate campaigns/development.example.json
      - run: uv build
  postgres-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra reference
      - run: uv run --locked --extra reference pytest -ra
