name: CI
on:
  push:
    branches: [main, foundation/project-setup, milestone/reference-verifier]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} ruff check .
      - run: uv run --locked --python ${{ matrix.python }} ruff format --check .
      - run: uv run --locked --python ${{ matrix.python }} pytest
      - run: uv run --locked --python ${{ matrix.python }} research validate campaigns/development.example.json
      - run: uv build
  postgres-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra reference
      - run: uv run --locked --extra reference pytest -ra
  worker-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUIRE_DOCKER_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked
      - name: Preload trusted probe image and resolve its immutable ID
        run: |
          docker --host unix:///var/run/docker.sock pull python:3.12-slim
          echo "TEST_WORKER_IMAGE_ID=$(docker --host unix:///var/run/docker.sock image inspect python:3.12-slim --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: uv run --locked pytest -m worker -ra
  harbor-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --group harbor
      - name: Start and verify local Docker before Harbor preflight
        run: |
          sudo systemctl start docker
          timeout 60 bash -c 'until docker --host unix:///var/run/docker.sock info >/dev/null 2>&1; do sleep 2; done'
          docker compose version
      # Harbor's 30-second no-network kernel probe includes this pull and
      # caches a failure for the whole process.
      - name: Preload Harbor's pinned egress kernel-probe image
        run: docker pull alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
      - name: Run controls and sealed replays in separate verifier containers
        run: uv run --locked --group harbor python scripts/harbor_replay.py
      - name: Audit observed container boundary with a reviewed tamper control
        run: uv run --locked --group harbor python scripts/harbor_audit.py
  terminus-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REQUIRE_HARBOR_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --group harbor
      - name: Scripted transport unit tests (Harbor required, no skips)
        run: uv run --locked --group harbor pytest tests/test_terminus_conformance.py -ra
      - name: Start and verify local Docker before Harbor preflight
        run: |
          sudo systemctl start docker
          timeout 60 bash -c 'until docker --host unix:///var/run/docker.sock info >/dev/null 2>&1; do sleep 2; done'
          docker compose version
      - name: Preload Harbor's pinned egress kernel-probe image
        run: docker pull alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
      - name: Model-free Terminus2 conformance through the audited boundary
        timeout-minutes: 30
        run: uv run --locked --group harbor python scripts/terminus_conformance.py
  metered-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQUIRE_HARBOR_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --group harbor
      - name: Brokered Terminus2 client unit tests (Harbor required, no skips)
        run: uv run --locked --group harbor pytest tests/test_metered_terminus.py -ra
      - name: Start and verify local Docker before Harbor preflight
        run: |
          sudo systemctl start docker
          timeout 60 bash -c 'until docker --host unix:///var/run/docker.sock info >/dev/null 2>&1; do sleep 2; done'
          docker compose version
      - name: Preload Harbor's pinned egress kernel-probe image
        run: docker pull alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
      - name: Model-free metered calibration trial through the full runtime lifecycle
        timeout-minutes: 30
        run: uv run --locked --group harbor python scripts/calibration.py --dry-run
      - name: Model-free pilot trial (full_tool, protocol v4) through the same lifecycle
        timeout-minutes: 30
        run: uv run --locked --group harbor python scripts/pilot.py --dry-run
  harbor-apps:
    name: harbor-apps (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task: [invoice-read, invoice-search, invoice-export]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --group harbor
      - name: Start and verify local Docker before Harbor preflight
        run: |
          sudo systemctl start docker
          timeout 60 bash -c 'until docker --host unix:///var/run/docker.sock info >/dev/null 2>&1; do sleep 2; done'
          docker compose version
      - name: Preload Harbor's pinned egress kernel-probe image
        run: docker pull alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
      - name: Run oracle, nop and unsafe controls, sealed replays and boundary audits
        run: uv run --locked --group harbor python scripts/harbor_apps.py ${{ matrix.task }}
  pilot-controls:
    name: pilot-controls (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family:
          - invoice-read
          - invoice-search
          - invoice-export
          - invoice-update
          - invoice-create
          - invoice-summary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --group harbor
      - name: Generated pilot variants match their sources
        run: uv run --locked python scripts/build_pilot_tasks.py --check
      - name: Start and verify local Docker before Harbor preflight
        run: |
          sudo systemctl start docker
          timeout 60 bash -c 'until docker --host unix:///var/run/docker.sock info >/dev/null 2>&1; do sleep 2; done'
          docker compose version
      - name: Preload Harbor's pinned egress kernel-probe image
        run: docker pull alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
      - name: Oracle, nop, unsafe and self-check controls with audits for all four conditions
        run: uv run --locked --group harbor python scripts/pilot_controls.py ${{ matrix.family }}
